# Syncs docs/**/*.md to Google Drive after a push/merge to main.
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICE_ACCOUNT_JSON  full contents of the service-account key file
#
# Structural config (driveFolderId, orgDomain) lives in the committed
# docpipe.yaml manifest — not here (ADR-0003).
#
# Trigger filter is path-scoped to docs/**, so the index commit this job
# pushes back does not re-trigger the workflow (it only touches _index.json).

name: Sync docs to Drive

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Write service account key
        env:
          SA_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          mkdir -p "$RUNNER_TEMP/sa"
          printf '%s' "$SA_JSON" > "$RUNNER_TEMP/sa/key.json"
          chmod 600 "$RUNNER_TEMP/sa/key.json"

      - name: Run sync
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa/key.json
        run: npm run push

      - name: Commit updated _index.json
        run: |
          if [[ -z "$(git status --porcelain _index.json)" ]]; then
            echo "No _index.json changes to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _index.json
          git commit -m "chore(docs): sync _index.json [skip ci]"
          git push
