# Syncs docs/**/*.md to Google Drive after a push/merge to main, via the local
# possum composite action (dogfoods action.yml).
#
# Required repository secret (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICE_ACCOUNT_JSON  full contents of the service-account key file
#
# Structural config (driveFolderId, orgDomain) lives in the committed
# possum.yaml manifest — not here (ADR-0003).
#
# Trigger filter is path-scoped to docs/**, so the ledger commit this job pushes
# back does not re-trigger the workflow (it only touches ledger.json).

name: Sync docs to Drive

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so rename detection can diff lastSyncedSha..HEAD

      - name: Publish to Drive
        uses: ./
        with:
          command: push
          google-credentials-json: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Commit updated ledger
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(docs): sync ledger [skip ci]"
            git push
          fi
