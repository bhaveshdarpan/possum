# Reusable workflow: the full possum lifecycle for an adopting repo — check
# out, run the engine, commit the ledger back (push), and comment the plan (PR).
#
# Adopt it with a ~15-line caller — see examples/possum-adopter.yml. The engine
# is pinned via the action ref below (`@main`); bump it to a release tag when you
# cut one.

name: possum publish

on:
  workflow_call:
    inputs:
      command:
        description: "push (write to Drive) or plan (dry-run)"
        type: string
        default: push
      manifest:
        description: "Path to possum.yaml"
        type: string
        default: possum.yaml
    secrets:
      google-credentials-json:
        description: "Service-account key JSON contents (required for push)"
        required: false

permissions:
  contents: write # commit the ledger back
  pull-requests: write # post the dry-run plan comment

jobs:
  possum:
    runs-on: ubuntu-latest
    concurrency:
      group: possum-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so rename detection can diff lastSyncedSha..HEAD

      - name: Run possum
        uses: bhaveshdarpan/possum@main
        with:
          command: ${{ inputs.command }}
          manifest: ${{ inputs.manifest }}
          google-credentials-json: ${{ secrets.google-credentials-json }}

      - name: Commit ledger
        if: ${{ inputs.command == 'push' }}
        shell: bash
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No ledger changes to commit."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(docs): sync ledger [skip ci]"
            git push
          fi

      - name: Comment plan on PR
        if: ${{ inputs.command == 'plan' && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- possum-dry-run -->';
            const out = fs.readFileSync(`${process.env.RUNNER_TEMP}/possum.out`, 'utf8');
            const body = `${marker}\n## possum dry-run\n\`\`\`\n${out}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
