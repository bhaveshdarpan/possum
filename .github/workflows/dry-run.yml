# PR check: runs the possum planner in dry-run mode (via the local composite
# action) and reports what a merge would create / update / rename / delete.
# Planning is read-only, so this needs NO service-account secret — safe on PRs,
# including from forks.

name: possum dry-run

on:
  pull_request:
    paths:
      - "docs/**"
      - "possum.yaml"

permissions:
  contents: read
  pull-requests: write

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so rename detection can diff lastSyncedSha..HEAD

      # Fails the check if the manifest is invalid (P0-2 fail-fast) or planning
      # errors — surfacing the problem on the PR before it reaches main. The
      # action also writes the plan to the job summary.
      - name: Dry-run (plan only, no writes)
        uses: ./
        with:
          command: plan

      # Sticky comment (same-repo PRs only; fork tokens are read-only). The job
      # summary the action writes always renders, so forks still get the plan.
      - name: Comment plan on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- possum-dry-run -->';
            const out = fs.readFileSync(`${process.env.RUNNER_TEMP}/possum.out`, 'utf8');
            const body = `${marker}\n## possum dry-run\n\`\`\`\n${out}\n\`\`\``;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
